<!DOCTYPE html>
<html lang="{{LANG}}">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{NAME}} - Resume</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Carlito:ital,wght@0,400;0,700;1,400;1,700&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { -webkit-print-color-adjust: exact; print-color-adjust: exact; }

  body {
    font-family: Calibri, Carlito, 'Segoe UI', sans-serif;
    font-size: 7.5pt;
    line-height: 10pt;
    color: #000;
    background: #fff;
    padding: 0;
    margin: 0;
  }

  .page { width: 100%; max-width: {{PAGE_WIDTH}}; margin: 0 auto; padding: 0; }
  a { color: #1155CC; text-decoration: none; }

  /* === HEADER === */
  .header { text-align: center; margin-bottom: 1pt; }
  .header h1 { font-size: 18pt; font-weight: 700; color: #000; line-height: 1.15; margin-bottom: 1pt; }
  .contact-row { font-size: 7.5pt; line-height: 10pt; color: #000; text-align: center; }
  .contact-row a { color: #1155CC; }
  .contact-row .sep { color: #000; margin: 0 3pt; }

  /* === SECTIONS === */
  .section { margin-top: 3pt; margin-bottom: 0pt; }
  .section-title {
    font-size: 8.5pt;
    font-weight: 700;
    text-transform: uppercase;
    color: #1155CC;
    border-bottom: 1px solid #1155CC;
    padding-bottom: 0pt;
    margin-bottom: 1.5pt;
    line-height: 10pt;
    letter-spacing: 0.02em;
  }

  /* === SUMMARY === */
  .summary-text { font-size: 7.5pt; line-height: 10pt; color: #000; }

  /* === SKILLS === */
  .skills-grid { font-size: 7.5pt; line-height: 10pt; }
  .skill-item { font-size: 7.5pt; line-height: 10pt; color: #000; margin-bottom: 0pt; }
  .skill-category { font-weight: 700; }

  /* === EXPERIENCE === */
  .job { margin-top: 2pt; margin-bottom: 0pt; }
  .job-header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 4pt;
    line-height: 10pt;
  }
  .job-title-line { font-size: 8.5pt; line-height: 10pt; }
  .job-title { font-weight: 700; font-size: 8.5pt; }
  .job-company { font-style: italic; font-size: 8.5pt; }
  .job-period { font-size: 8.5pt; color: #000; white-space: nowrap; }
  .job ul { padding-left: 0.3in; margin-top: 0pt; list-style-position: outside; }
  .job li { font-size: 7.5pt; line-height: 10pt; color: #000; margin-bottom: 0pt; }

  /* === PROJECTS === */
  .project { margin-top: 2pt; margin-bottom: 0pt; }
  .project-header { line-height: 10pt; }
  .project-title-line {
    font-size: 8.5pt;
    line-height: 10pt;
    display: flex;
    justify-content: space-between;
    align-items: baseline;
  }
  .project-title { font-size: 8.5pt; font-weight: 700; color: #000; }
  .project-tech { font-size: 7.5pt; color: #000; font-style: italic; white-space: nowrap; }
  .project ul { padding-left: 0.3in; margin-top: 0pt; list-style-position: outside; }
  .project li { font-size: 7.5pt; line-height: 10pt; color: #000; margin-bottom: 0pt; }

  /* === EDUCATION === */
  .edu-item { margin-top: 2pt; margin-bottom: 0pt; }
  .edu-header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 4pt;
    line-height: 10pt;
  }
  .edu-title { font-weight: 700; font-size: 8.5pt; color: #000; }
  .edu-year { font-size: 8.5pt; color: #000; white-space: nowrap; }
  .edu-desc { font-size: 7.5pt; color: #000; line-height: 10pt; }

  /* === AWARDS === */
  .award-item { font-size: 7.5pt; line-height: 10pt; margin-bottom: 0pt; }
  .award-title { font-weight: 700; }

  /* === PRINT === */
  @media print {
    body { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    .page { padding: 0; }
  }

  /* === BREAK CONTROL === */
  .avoid-break, .job, .project, .edu-item { break-inside: avoid; page-break-inside: avoid; }
</style>
</head>
<body>
<div class="page">

  <!-- HEADER -->
  <div class="header">
    <h1>{{NAME}}</h1>
    <div class="contact-row">
      {{PHONE}}<span class="sep">|</span>
      <a href="mailto:{{EMAIL}}">{{EMAIL}}</a><span class="sep">|</span>
      <a href="{{LINKEDIN_URL}}">{{LINKEDIN_DISPLAY}}</a><span class="sep">|</span>
      <a href="{{PORTFOLIO_URL}}">{{PORTFOLIO_DISPLAY}}</a><span class="sep">|</span>
      {{LOCATION}}
    </div>
  </div>

  <!-- SUMMARY -->
  <div class="section">
    <div class="section-title">Summary</div>
    <div class="summary-text">{{SUMMARY_TEXT}}</div>
  </div>

  <!-- SKILLS -->
  <div class="section">
    <div class="section-title">Skills</div>
    <div class="skills-grid">
      {{SKILLS}}
    </div>
  </div>

  <!-- EXPERIENCE -->
  <div class="section">
    <div class="section-title">Experience</div>
    {{EXPERIENCE}}
  </div>

  <!-- PROJECTS -->
  <div class="section">
    <div class="section-title">Projects</div>
    {{PROJECTS}}
  </div>

  <!-- EDUCATION -->
  <div class="section">
    <div class="section-title">Education</div>
    {{EDUCATION}}
  </div>

  <!-- AWARDS (omit if none) -->
  {{AWARDS_SECTION}}

</div>
</body>
</html>
